name: Serverless deploy

# Lambda + API Gateway + DynamoDB + Cognito + SNS/SQS yigini (infra/*.tf).
#   - Her push / PR: typecheck, test, build:lambda, terraform fmt/validate/test (kimlik bilgisiz)
#   - Kimlik bilgisi varsa: terraform plan (adim ozetine yazilir)
#   - Yalnizca main'e push: terraform apply + saglik kontrolu (environment: production)
#
# AWS kimlik bilgileri (oncelik sirasiyla):
#   1. OIDC: repo variable AWS_DEPLOY_ROLE_ARN (bkz. infra/github-oidc) - onerilen
#   2. Secrets: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# Opsiyonel repo variable'lari: AWS_REGION, ALERT_EMAIL, CORS_ALLOW_ORIGINS (JSON liste),
# COGNITO_USER_POOL_TIER (LITE | ESSENTIALS), SES_IDENTITY_ARN, SES_FROM_ADDRESS.

on:
  push:
    branches: [main, feature/aws-entegrasyonu]
    paths:
      - "apps/api/**"
      - "infra/*.tf"
      - "infra/tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/serverless-deploy.yml"
  pull_request:
    branches: [main, feature/aws-entegrasyonu]
    paths:
      - "apps/api/**"
      - "infra/*.tf"
      - "infra/tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/serverless-deploy.yml"
  workflow_dispatch:

concurrency:
  group: serverless-${{ github.ref }}
  # PR'larda eski calisma iptal edilir; main'de bir apply asla yarida kesilmez.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24.22.2"
  TF_VERSION: "~1.17.0"
  TF_DIR: infra
  TF_STATE_KEY: serverless/terraform.tfstate
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Terraform degiskenleri (bos repo variable -> variables.tf varsayilani)
  TF_VAR_environment: prod
  TF_VAR_app_version: ${{ github.sha }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  # Canli web (Cloudflare Pages, Git entegrasyonu) + yerel gelistirme. Repo variable verilirse onu kullanir.
  TF_VAR_cors_allow_origins: ${{ vars.CORS_ALLOW_ORIGINS || '["http://localhost:5173","https://building-management-apx.pages.dev"]' }}
  TF_VAR_cognito_user_pool_tier: ${{ vars.COGNITO_USER_POOL_TIER || 'LITE' }}
  TF_VAR_ses_identity_arn: ${{ vars.SES_IDENTITY_ARN }}
  TF_VAR_ses_from_address: ${{ vars.SES_FROM_ADDRESS }}

jobs:
  # -------------------------------------------------------------------------
  build:
    name: Typecheck, test, build:lambda
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace apps/api
      - run: npm test --workspace apps/api
      - run: npm run build:lambda --workspace apps/api
      - name: Paket kontrolu
        run: |
          for f in api pre-token notification-worker scheduler-worker; do
            test -s "apps/api/dist/lambda/$f.mjs" || { echo "::error::Eksik paket: $f.mjs"; exit 1; }
          done
          ls -la apps/api/dist/lambda
      - uses: actions/upload-artifact@v7
        with:
          name: lambda-dist
          path: apps/api/dist/lambda/
          retention-days: 7
          if-no-files-found: error

  # -------------------------------------------------------------------------
  terraform-checks:
    name: Terraform fmt / validate / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: fmt
        run: |
          terraform -chdir=$TF_DIR fmt -check -diff
          terraform -chdir=$TF_DIR/tests fmt -check -diff
          terraform -chdir=$TF_DIR/github-oidc fmt -check -diff
      - name: init (backend'siz) + validate
        run: |
          terraform -chdir=$TF_DIR init -backend=false
          terraform -chdir=$TF_DIR validate
      # Sahte saglayicilarla plan testleri: AWS kimlik bilgisi gerekmez.
      - name: terraform test
        run: terraform -chdir=$TF_DIR test

  # -------------------------------------------------------------------------
  plan:
    name: Terraform plan
    needs: [build, terraform-checks]
    # Fork PR'larinda gizli bilgiler yoktur; plan atlanir (testler yine calisir).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: lambda-dist
          path: apps/api/dist/lambda

      - name: Kimlik bilgisi kaynagi
        id: creds
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -n "$ROLE" ]; then echo "mode=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "$KEY_ID" ]; then echo "mode=keys" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "::warning::AWS kimlik bilgisi yok (AWS_DEPLOY_ROLE_ARN veya AWS_ACCESS_KEY_ID); plan atlandi."
          fi

      - name: AWS (OIDC)
        if: steps.creds.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gh-plan-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
      - name: AWS (erisim anahtari)
        if: steps.creds.outputs.mode == 'keys'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}

      - name: Detect project region
        if: steps.creds.outputs.mode != 'none'
        run: bash scripts/ci/detect-aws-region.sh

      - uses: hashicorp/setup-terraform@v4
        if: steps.creds.outputs.mode != 'none'
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform state bucket (yoksa olustur)
        if: steps.creds.outputs.mode != 'none'
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          bucket="building-management-tfstate-${account_id}-${AWS_REGION}"
          if ! aws s3api head-bucket --bucket "$bucket" 2>/dev/null; then
            echo "State bucket olusturuluyor"
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$bucket"
            else
              aws s3api create-bucket --bucket "$bucket" --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$bucket" --versioning-configuration Status=Enabled
            aws s3api put-public-access-block --bucket "$bucket" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi
          echo "TF_STATE_BUCKET=$bucket" >> "$GITHUB_ENV"

      - name: terraform init
        if: steps.creds.outputs.mode != 'none'
        run: |
          terraform -chdir=$TF_DIR init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      - name: terraform plan
        if: steps.creds.outputs.mode != 'none'
        # Plan yalnizca okur; state kilidi alinmaz ki main'deki apply ile cakismasin.
        run: |
          terraform -chdir=$TF_DIR plan -lock=false -no-color -out=tfplan | tee plan.txt
          {
            echo "### Terraform plan (\`${GITHUB_REF_NAME}\`)"
            echo '```'
            grep -E '^(Plan:|No changes|  # )' plan.txt | head -100 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  deploy:
    name: Terraform apply (main)
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: lambda-dist
          path: apps/api/dist/lambda

      - name: Kimlik bilgisi kontrolu
        id: creds
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$ROLE" ]; then echo "mode=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "$KEY_ID" ] && [ -n "$SECRET" ]; then echo "mode=keys" >> "$GITHUB_OUTPUT"
          else
            echo "::error::AWS_DEPLOY_ROLE_ARN (variable) veya AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY (secret) tanimli degil."
            exit 1
          fi

      - name: AWS (OIDC)
        if: steps.creds.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gh-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
      - name: AWS (erisim anahtari)
        if: steps.creds.outputs.mode == 'keys'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}

      - name: Detect project region
        run: bash scripts/ci/detect-aws-region.sh

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          terraform -chdir=$TF_DIR init \
            -backend-config="bucket=building-management-tfstate-${account_id}-${AWS_REGION}" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      # Plan ve apply ayni iste: uygulanan, tam olarak incelenen plandir.
      - name: terraform plan
        run: terraform -chdir=$TF_DIR plan -no-color -out=tfplan

      - name: terraform apply
        run: terraform -chdir=$TF_DIR apply -auto-approve tfplan

      - name: Saglik kontrolu
        run: |
          url=$(terraform -chdir=$TF_DIR output -raw api_url)
          url="${url%/}"
          body=""
          for _ in $(seq 1 12); do
            body=$(curl -fsS --max-time 5 "$url/api/health" || true)
            if echo "$body" | grep -q "$GITHUB_SHA"; then break; fi
            sleep 5
          done
          echo "$body"
          echo "$body" | grep -q "$GITHUB_SHA" || { echo "::error::$url/api/health yeni surumu donmedi"; exit 1; }
          # Korumali uclar kimlik dogrulamasiz 401 donmeli (API Gateway JWT authorizer).
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$url/api/portal/my-unit")
          [ "$code" = "401" ] || { echo "::error::Korumali uc $code dondu (401 bekleniyordu)"; exit 1; }
          # Web adresleri (https) API'ye tarayicidan erisebilmeli: CORS on kontrolu.
          for origin in $(echo "$TF_VAR_cors_allow_origins" | jq -r '.[] | select(startswith("https://"))'); do
            allow=$(curl -s -D - -o /dev/null --max-time 5 -X OPTIONS "$url/api/health" \
              -H "Origin: $origin" -H "Access-Control-Request-Method: GET" \
              | tr -d '\r' | grep -i '^access-control-allow-origin:' | cut -d' ' -f2-)
            [ "$allow" = "$origin" ] || { echo "::error::API CORS $origin adresine izin vermiyor (allow-origin: '${allow}')"; exit 1; }
            echo "CORS tamam: $origin"
          done
          {
            echo "### Yayinda: $url"
            echo "Cognito token turu: \`$(terraform -chdir=$TF_DIR output -raw api_token_use)\`"
          } >> "$GITHUB_STEP_SUMMARY"
