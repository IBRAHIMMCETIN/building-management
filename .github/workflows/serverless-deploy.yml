name: Serverless deploy

# Lambda + API Gateway + DynamoDB + Cognito + SNS/SQS + S3 + Scheduler yigini (infra/*.tf).
#
# Hedef ortamlar:
#   - PR (main'e)      : build/test/terraform test + dev'e karsi salt-okunur plan (kilit alinmaz).
#   - main'e push      : dev yigini -> infra/dev.tfvars + serverless-dev state (environment: dev).
#                        Cloudflare Pages (building-management-apx.pages.dev) bu yigina baglidir.
#   - v* etiketi       : prod yigini -> serverless state (environment: production).
#                        git tag v0.1.0 && git push origin v0.1.0
#   - workflow_dispatch: target=dev | prod (prod yalnizca main veya v* etiketinden).
#
# AWS kimlik bilgileri (oncelik sirasiyla):
#   1. OIDC: repo variable AWS_DEPLOY_ROLE_ARN (bkz. infra/github-oidc) - onerilen
#   2. Secrets: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# Repo variable'lari: AWS_REGION (eu-north-1). ALERT_EMAIL (prod'da ZORUNLU: production
# environment variable olarak da tanimlanabilir; bos ise prod plan'i korkulukta durur),
# SES_IDENTITY_ARN, SES_FROM_ADDRESS (SES dogrulaninca). Ortam ayarlari (CORS, MFA, odeme,
# alan adi, Cognito katmani) infra/dev.tfvars ve infra/prod.tfvars'tadir; kontrol listesi
# infra/PROD_DEPLOY.md.

on:
  push:
    branches: [main]
    # Etiket push'larinda path filtresi uygulanmaz; her v* etiketi prod dagitimini tetikler.
    tags: ["v*"]
    paths:
      - "apps/api/**"
      - "infra/*.tf"
      - "infra/*.tfvars"
      - "infra/*.tfbackend"
      - "infra/tests/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/ci/**"
      - ".github/workflows/serverless-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "infra/*.tf"
      - "infra/*.tfvars"
      - "infra/*.tfbackend"
      - "infra/tests/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/ci/**"
      - ".github/workflows/serverless-deploy.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Hedef ortam (prod yalnizca main dalindan veya v* etiketinden)"
        type: choice
        options: [dev, prod]
        default: dev

concurrency:
  # PR'lar kendi grubunda (eski calisma iptal edilir). Tum apply'lar (dev ve prod) tek
  # sirada calisir ve asla yarida kesilmez.
  group: ${{ github.event_name == 'pull_request' && format('serverless-pr-{0}', github.ref) || 'serverless-apply' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24.22.2"
  TF_VERSION: "~1.17.0"
  TF_DIR: infra
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Iki ortamda ortak Terraform degiskenleri (bos repo variable -> variables.tf varsayilani).
  # Ortama ozel olanlar dev.tfvars / prod.tfvars'tan (scripts/ci/tf-init.sh her plan'a ekler).
  TF_VAR_app_version: ${{ github.sha }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  TF_VAR_ses_identity_arn: ${{ vars.SES_IDENTITY_ARN }}
  TF_VAR_ses_from_address: ${{ vars.SES_FROM_ADDRESS }}

jobs:
  # -------------------------------------------------------------------------
  target:
    name: Hedef ortam
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.t.outputs.env }}
      deploy: ${{ steps.t.outputs.deploy }}
    steps:
      - id: t
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          deploy=false
          case "$EVENT" in
            pull_request)
              target=dev ;;
            push)
              deploy=true
              if [[ "$REF" == refs/tags/v* ]]; then target=prod; else target=dev; fi ;;
            workflow_dispatch)
              deploy=true
              target="${INPUT_TARGET:-dev}"
              if [ "$target" = prod ] && [[ "$REF" != refs/heads/main && "$REF" != refs/tags/v* ]]; then
                echo "::error::prod yalnizca main dalindan veya v* etiketinden dagitilabilir (ref: $REF)."
                exit 1
              fi ;;
            *)
              echo "::error::Beklenmeyen olay: $EVENT"; exit 1 ;;
          esac
          echo "env=$target" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "### Hedef ortam: \`$target\` (deploy: $deploy, ref: \`$REF\`)" >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  build:
    name: Typecheck, test, build:lambda
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace apps/api
      - run: npm test --workspace apps/api
      - run: npm run build:lambda --workspace apps/api
      - name: Paket kontrolu
        run: |
          for f in api pre-token notification-worker scheduler-worker bulk-worker outbox-relay; do
            test -s "apps/api/dist/lambda/$f.mjs" || { echo "::error::Eksik paket: $f.mjs"; exit 1; }
          done
          ls -la apps/api/dist/lambda
      - uses: actions/upload-artifact@v7
        with:
          name: lambda-dist
          path: apps/api/dist/lambda/
          retention-days: 7
          if-no-files-found: error

  # -------------------------------------------------------------------------
  terraform-checks:
    name: Terraform fmt / validate / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: fmt
        run: |
          terraform -chdir=$TF_DIR fmt -check -diff
          terraform -chdir=$TF_DIR/tests fmt -check -diff
          terraform -chdir=$TF_DIR/github-oidc fmt -check -diff
      - name: init (backend'siz) + validate
        run: |
          terraform -chdir=$TF_DIR init -backend=false
          terraform -chdir=$TF_DIR validate
      # Sahte saglayicilarla plan testleri: AWS kimlik bilgisi gerekmez.
      - name: terraform test
        run: terraform -chdir=$TF_DIR test

  # -------------------------------------------------------------------------
  plan:
    name: Terraform plan (PR -> dev)
    needs: [target, build, terraform-checks]
    # Yalnizca PR'larda; fork PR'larinda gizli bilgi olmadigindan atlanir.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: lambda-dist
          path: apps/api/dist/lambda

      - name: Kimlik bilgisi kaynagi
        id: creds
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -n "$ROLE" ]; then echo "mode=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "$KEY_ID" ]; then echo "mode=keys" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "::warning::AWS kimlik bilgisi yok (AWS_DEPLOY_ROLE_ARN veya AWS_ACCESS_KEY_ID); plan atlandi."
          fi

      - name: AWS (OIDC)
        if: steps.creds.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gh-plan-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'eu-north-1' }}
      - name: AWS (erisim anahtari)
        if: steps.creds.outputs.mode == 'keys'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'eu-north-1' }}

      - name: Detect project region
        if: steps.creds.outputs.mode != 'none'
        run: bash scripts/ci/detect-aws-region.sh

      - uses: hashicorp/setup-terraform@v4
        if: steps.creds.outputs.mode != 'none'
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init (${{ needs.target.outputs.env }})
        if: steps.creds.outputs.mode != 'none'
        run: bash scripts/ci/tf-init.sh "${{ needs.target.outputs.env }}"

      - name: terraform plan
        if: steps.creds.outputs.mode != 'none'
        # Plan yalnizca okur; state kilidi alinmaz ki main'deki apply ile cakismasin.
        run: |
          set -o pipefail
          terraform -chdir=$TF_DIR plan -lock=false -no-color -out=tfplan | tee plan.txt
          {
            echo "### Terraform plan (\`${{ needs.target.outputs.env }}\`, PR #${{ github.event.pull_request.number }})"
            echo '```'
            grep -E '^(Plan:|No changes|  # )' plan.txt | head -100 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  deploy:
    name: Terraform apply (${{ needs.target.outputs.env }})
    needs: [target, build, terraform-checks]
    if: needs.target.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # OIDC sub claim'i: repo:<owner>/<repo>:environment:<dev|production> (bkz. infra/github-oidc).
    environment: ${{ needs.target.outputs.env == 'prod' && 'production' || 'dev' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: lambda-dist
          path: apps/api/dist/lambda

      - name: Kimlik bilgisi kontrolu
        id: creds
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$ROLE" ]; then echo "mode=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "$KEY_ID" ] && [ -n "$SECRET" ]; then echo "mode=keys" >> "$GITHUB_OUTPUT"
          else
            echo "::error::AWS_DEPLOY_ROLE_ARN (variable) veya AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY (secret) tanimli degil."
            exit 1
          fi

      - name: AWS (OIDC)
        if: steps.creds.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gh-deploy-${{ needs.target.outputs.env }}-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'eu-north-1' }}
      - name: AWS (erisim anahtari)
        if: steps.creds.outputs.mode == 'keys'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'eu-north-1' }}

      - name: Detect project region
        run: bash scripts/ci/detect-aws-region.sh

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init (${{ needs.target.outputs.env }})
        run: bash scripts/ci/tf-init.sh "${{ needs.target.outputs.env }}"

      # Plan ve apply ayni iste: uygulanan, tam olarak incelenen plandir.
      - name: terraform plan
        run: |
          set -o pipefail
          terraform -chdir=$TF_DIR plan -no-color -out=tfplan | tee plan.txt
          {
            echo "### Terraform plan (\`${{ needs.target.outputs.env }}\`)"
            echo '```'
            grep -E '^(Plan:|No changes|  # )' plan.txt | head -100 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: terraform apply
        run: terraform -chdir=$TF_DIR apply -auto-approve tfplan

      - name: Saglik kontrolu
        run: |
          url=$(terraform -chdir=$TF_DIR output -raw api_url)
          url="${url%/}"
          body=""
          for _ in $(seq 1 12); do
            body=$(curl -fsS --max-time 5 "$url/api/health" || true)
            if echo "$body" | grep -q "$GITHUB_SHA"; then break; fi
            sleep 5
          done
          echo "$body"
          echo "$body" | grep -q "$GITHUB_SHA" || { echo "::error::$url/api/health yeni surumu donmedi"; exit 1; }
          # Korumali uclar kimlik dogrulamasiz 401 donmeli (API Gateway JWT authorizer).
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$url/api/portal/my-unit")
          [ "$code" = "401" ] || { echo "::error::Korumali uc $code dondu (401 bekleniyordu)"; exit 1; }
          # Web adresleri (https) API'ye tarayicidan erisebilmeli: CORS on kontrolu.
          # Liste Terraform ciktisindan (tfvars + custom_domain); dev ve prod ayni yol.
          origins=$(terraform -chdir=$TF_DIR output -json cors_allow_origins)
          for origin in $(echo "$origins" | jq -r '.[] | select(startswith("https://"))'); do
            allow=$(curl -s -D - -o /dev/null --max-time 5 -X OPTIONS "$url/api/health" \
              -H "Origin: $origin" -H "Access-Control-Request-Method: GET" \
              | tr -d '\r' | grep -i '^access-control-allow-origin:' | cut -d' ' -f2-)
            [ "$allow" = "$origin" ] || { echo "::error::API CORS $origin adresine izin vermiyor (allow-origin: '${allow}')"; exit 1; }
            echo "CORS tamam: $origin"
          done
          {
            echo "### Yayinda (\`${{ needs.target.outputs.env }}\`): $url"
            echo "Cognito token turu: \`$(terraform -chdir=$TF_DIR output -raw api_token_use)\`"
          } >> "$GITHUB_STEP_SUMMARY"
