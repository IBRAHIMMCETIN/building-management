name: "[Arsiv] Deploy web to EC2"

# ARSIV: Proje serverless mimariye (Lambda + API Gateway + DynamoDB, bkz.
# serverless-deploy.yml) ve web icin Cloudflare Pages'e tasindi. EC2 yolu artik kullanilmiyor.
# Otomatik tetikleme (push) kaldirildi; yalnizca elle calistirilabilir. Ihtiyac kalmadiginda
# bu dosya ve infra/ec2 birlikte silinecek.
# Typecheck/test artik ci.yml'de kosar.

on:
  workflow_dispatch:

concurrency:
  group: deploy-web-ec2
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24.22.2"
  TF_DIR: infra/ec2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run release
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check AWS secrets
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$SECRET" ]; then
            echo "::error::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY tanimli degil (Settings > Secrets and variables > Actions ya da Environments > production)."
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}

      - name: Detect project region
        run: bash scripts/ci/detect-aws-region.sh

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.17.0"
          terraform_wrapper: false

      - name: Terraform state bucket (yoksa olustur)
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          bucket="building-management-tfstate-${account_id}-${AWS_REGION}"
          if ! aws s3api head-bucket --bucket "$bucket" 2>/dev/null; then
            echo "State bucket olusturuluyor"
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$bucket"
            else
              aws s3api create-bucket --bucket "$bucket" --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$bucket" --versioning-configuration Status=Enabled
            aws s3api put-public-access-block --bucket "$bucket" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi
          echo "TF_STATE_BUCKET=$bucket" >> "$GITHUB_ENV"

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=ec2/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"
          terraform validate
          terraform apply -input=false -auto-approve
          {
            echo "INSTANCE_ID=$(terraform output -raw instance_id)"
            echo "PUBLIC_IP=$(terraform output -raw public_ip)"
            echo "ARTIFACTS_BUCKET=$(terraform output -raw artifacts_bucket)"
          } >> "$GITHUB_ENV"

      - name: Upload release to S3
        run: |
          prefix="releases/$GITHUB_SHA"
          tar -czf release.tar.gz -C release .
          aws s3 cp release.tar.gz "s3://$ARTIFACTS_BUCKET/$prefix/release.tar.gz" --only-show-errors
          aws s3 cp deploy/ec2/remote-deploy.sh "s3://$ARTIFACTS_BUCKET/$prefix/remote-deploy.sh" --only-show-errors
          echo "RELEASE_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Wait for SSM agent
        run: |
          for i in $(seq 1 60); do
            status=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || true)
            if [ "$status" = "Online" ]; then
              echo "SSM agent online"
              exit 0
            fi
            echo "SSM agent bekleniyor ($i/60): $status"
            sleep 10
          done
          echo "::error::Instance 10 dakikada SSM'e baglanmadi"
          exit 1

      - name: Deploy on instance (SSM Run Command)
        run: |
          params=$(jq -n \
            --arg b "$ARTIFACTS_BUCKET" --arg p "$RELEASE_PREFIX" --arg v "$GITHUB_SHA" \
            --arg n "$NODE_VERSION" --arg r "$AWS_REGION" \
            '{
              commands: [
                "set -eu",
                "aws s3 cp s3://\($b)/\($p)/remote-deploy.sh /tmp/bm-remote-deploy.sh --region \($r) --only-show-errors",
                "bash /tmp/bm-remote-deploy.sh \($b) \($p)/release.tar.gz \($v) \($n) \($r)"
              ],
              executionTimeout: ["900"]
            }')
          cmd_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $GITHUB_SHA" \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command: $cmd_id"

          status=Pending
          for _ in $(seq 1 180); do
            status=$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          echo "----- stdout -----"
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "----- stderr -----"
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true

          if [ "$status" != "Success" ]; then
            echo "::error::Deploy komutu basarisiz: $status"
            exit 1
          fi

      - name: Smoke test
        run: |
          url="http://$PUBLIC_IP"
          body=""
          for _ in $(seq 1 12); do
            body=$(curl -fsS --max-time 5 "$url/api/health" || true)
            if echo "$body" | grep -q "$GITHUB_SHA"; then
              break
            fi
            sleep 5
          done
          echo "$body"
          echo "$body" | grep -q "$GITHUB_SHA" || { echo "::error::$url/api/health yeni surumu donmedi"; exit 1; }
          curl -fsS --max-time 5 "$url/" | grep -q '<div id="root">' || { echo "::error::$url/ React sayfasini donmedi"; exit 1; }
          echo "Yayinda: $url"
          echo "### Yayinda: $url" >> "$GITHUB_STEP_SUMMARY"

      # Aylik maliyet uyarisi. Deploy'dan ayri state'te; hata verirse deploy'u bozmaz.
      - name: Budget alert (Terraform)
        if: vars.BUDGET_ALERT_EMAIL != ''
        continue-on-error: true
        working-directory: infra/budget
        env:
          TF_VAR_alert_email: ${{ vars.BUDGET_ALERT_EMAIL }}
          TF_VAR_monthly_limit_usd: ${{ vars.BUDGET_MONTHLY_USD || '15' }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=budget/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"
          terraform apply -input=false -auto-approve

      - name: Budget alert atlandi
        if: vars.BUDGET_ALERT_EMAIL == ''
        run: echo "::notice::Budget uyarisi icin repo variable BUDGET_ALERT_EMAIL tanimli degil, adim atlandi."
