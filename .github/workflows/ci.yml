name: CI

# Her push ve PR'da tum calisma alanlari: typecheck, test, web derlemesi; mobil (Expo) ayri is.
# AWS kimlik bilgisi GEREKMEZ (testler mock/sahte istemcilerle kosar). Dagitim ayri:
# serverless-deploy.yml (API + altyapi).

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main, feature/**]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24.22.2"

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Web derlemesi production modunda: VITE_AUTH_MODE=mock yasak oldugu icin sahte
      # Cognito degerleriyle derlenir (yalnizca derlenebilirlik kontrolu; yayinlanmaz).
      - name: Web build
        run: npm run build --workspace apps/web
        env:
          VITE_AUTH_MODE: cognito
          VITE_COGNITO_REGION: eu-north-1
          VITE_COGNITO_USER_POOL_ID: eu-north-1_ci
          VITE_COGNITO_USER_POOL_CLIENT: ci-client

  # Mobil uygulama (apps/mobile, Expo) ve ortak paket (packages/shared). EAS derlemesi YOK
  # (Expo hesabi / imza gerekmez); Metro paketlemesi web hedefiyle denetlenir.
  mobile:
    name: Mobil (typecheck, test, Metro paketi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace @bm/shared --workspace @bm/mobile
      - run: npm test --workspace @bm/shared --workspace @bm/mobile
      # Sahte Cognito degerleriyle production paketi (yalnizca derlenebilirlik; yayinlanmaz).
      - name: Metro paketi (web hedefi)
        run: npx expo export --platform web
        working-directory: apps/mobile
        env:
          CI: "1"
          EXPO_PUBLIC_AUTH_MODE: cognito
          EXPO_PUBLIC_API_URL: https://api.example.invalid
          EXPO_PUBLIC_COGNITO_REGION: eu-north-1
          EXPO_PUBLIC_COGNITO_USER_POOL_ID: eu-north-1_ci
          EXPO_PUBLIC_COGNITO_USER_POOL_CLIENT: ci-client
