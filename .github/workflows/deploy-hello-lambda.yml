name: Deploy hello Lambda

on:
  push:
    branches: [main]
    paths:
      - "infra/hello-lambda/**"
      - ".github/workflows/deploy-hello-lambda.yml"
  workflow_dispatch:

concurrency:
  group: deploy-hello-lambda
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_DIR: infra/hello-lambda
  STACK_NAME: building-management-hello
  FUNCTION_NAME: building-management-hello

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Unit tests
        working-directory: ${{ env.APP_DIR }}
        run: python -m unittest discover -s tests -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check AWS secrets
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$SECRET" ]; then
            echo "::error::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY tanimli degil (Settings > Secrets and variables > Actions ya da Environments > production)."
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}

      - name: Detect project region
        run: bash scripts/ci/detect-aws-region.sh

      - name: Who am I
        run: aws sts get-caller-identity

      - name: Build
        working-directory: ${{ env.APP_DIR }}
        run: sam build

      - name: Deploy
        working-directory: ${{ env.APP_DIR }}
        run: |
          sam deploy \
            --stack-name "$STACK_NAME" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "GitSha=$GITHUB_SHA"

      - name: Smoke test
        run: |
          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --cli-binary-format raw-in-base64-out \
            --payload '{}' \
            response.json
          cat response.json; echo
          jq -e '.statusCode == 200' response.json
          deployed_sha=$(jq -r '.body | fromjson | .git_sha' response.json)
          if [ "$deployed_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Lambda eski kodu dondu: $deployed_sha (beklenen $GITHUB_SHA)"
            exit 1
          fi
          echo "Lambda yeni commit'i calistiriyor: $deployed_sha"
