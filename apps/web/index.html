    <!--
      Tanitim sayfasi derlemede #root'a on-render edilir (scripts/prerender.mjs). Uygulama rotalarinda
      ve oturum izi olan tarayicida bu icerik boyanmadan gizlenir; karar src/lib/landingBoot.ts ile ayni.
    -->
    <style>
      html[data-app-shell] #root[data-prerender] {
        display: none;
      }
    </style>
    <script id="boot-mode">
      (function () {
        var d = document.documentElement;
        if (location.pathname !== '/') return d.setAttribute('data-app-shell', '');
        try {
          var s = window.localStorage;
          if (s.getItem('bm.mock-session')) return d.setAttribute('data-app-shell', '');
          for (var i = 0; i < s.length; i++) {
            var k = s.key(i) || '';
            if (k.indexOf('CognitoIdentityServiceProvider.') === 0 && /\.LastAuthUser$/.test(k)) return d.setAttribute('data-app-shell', '');
          }
        } catch (e) {
          // Depo kapaliysa (gizli pencere vb.) tanitim sayfasi gosterilir; giris yine /login'den.
        }
      })();
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
